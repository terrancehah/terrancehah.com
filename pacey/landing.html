<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacey — Your race-readiness companion</title>
    <!-- Compatibility stub — the landing moved to the canonical /pacey/
         (pacey/index.html). Old /pacey/landing.html links forward there;
         Vercel permanent-redirects this path for visitors who never load
         the file. Query and hash are preserved so entry=demo / entry=login
         links and section anchors keep working through the redirect. -->
    <link rel="canonical" href="https://terrancehah.com/pacey">
    <!-- Belt-and-braces: production already redirects this path to /pacey,
         but if the stub is ever served it should not index. -->
    <meta name="robots" content="noindex,follow">
    <script>
        location.replace('/pacey/' + location.search + location.hash);
    </script>
</head>
<body>
    <!-- No-JS fallback: the script above is the whole page. -->
    <p><a href="/pacey/">Pacey — your race-readiness companion</a></p>
</body>
</html>
